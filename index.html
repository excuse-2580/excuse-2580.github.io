<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黎夜的小站 🐾</title>
  <meta name="description" content="黎夜的个人主页 - furry / 游戏 / 数码折腾人">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
  <style>
/* ============================================================
   黎夜的小站 · style.css
   ============================================================ */

:root {
  /* 配色 */
  --bg: #f6f1ff;
  --bg-grad-1: #fce4ec;
  --bg-grad-2: #ede7f6;
  --surface: #ffffff;
  --text: #2d2640;
  --text-soft: #6b6380;
  --accent: #a18cd1;
  --accent-2: #ff8fa3;
  --line: #efe8f7;
  --warn-bg: #fff0f3;
  --warn-text: #d6456b;

  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;

  --shadow: 0 8px 30px rgba(140, 110, 180, 0.10);

  --sidebar-w: 280px;
}

/* ---------- reset ---------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei",
    "WenQuanYi Micro Hei", sans-serif;
  background: linear-gradient(150deg, var(--bg-grad-1), var(--bg-grad-2));
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.65;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; }
ul { list-style: none; }

/* ---------- 布局 ---------- */
.layout {
  display: flex;
  min-height: 100vh;
  max-width: 1120px;
  margin: 0 auto;
  padding: 24px;
  gap: 24px;
}

/* 侧边栏 */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: sticky;
  top: 24px;
  height: fit-content;
}
.profile {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  border-radius: var(--radius-lg);
  padding: 28px 20px 22px;
  text-align: center;
  color: #fff;
  box-shadow: var(--shadow);
}
.avatar {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.28);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 14px;
  border: 3px solid rgba(255, 255, 255, 0.7);
  transition: transform .2s ease;
}
.avatar:hover { transform: scale(1.06) rotate(-4deg); }
.avatar .paw-print { font-size: 44px; }
.profile h1 { font-size: 24px; font-weight: 800; letter-spacing: .5px; }
.subtitle { font-size: 13px; opacity: .9; margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
.tag { background: rgba(255, 255, 255, 0.26); padding: 4px 11px; border-radius: 20px; font-size: 12px; }

/* 导航 */
.nav {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  box-shadow: var(--shadow);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: var(--radius-md);
  color: var(--text-soft);
  font-weight: 600;
  font-size: 14.5px;
  transition: background .15s, color .15s, transform .15s;
}
.nav-item:hover { background: var(--bg); transform: translateX(3px); }
.nav-item.active {
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff;
}
.nav-ic { font-size: 18px; width: 24px; text-align: center; }
.nav-count {
  margin-left: auto;
  background: var(--bg);
  color: var(--text-soft);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 700;
}
.nav-item.active .nav-count { background: rgba(255,255,255,.28); color: #fff; }

.sidebar-footer {
  text-align: center;
  font-size: 12px;
  color: var(--text-soft);
  padding: 8px;
}

/* 主内容区 */
.content { flex: 1; min-width: 0; }
.page { animation: fadeUp .35s ease; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 卡片 */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}
.card > h2 {
  font-size: 17px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card > h2 .ic { font-size: 19px; }
.card > h2 .hint { margin-left: auto; font-size: 12px; color: var(--text-soft); font-weight: 500; }
p { margin-bottom: 10px; }
.muted { color: var(--text-soft); font-size: 13.5px; }

/* hero */
.hero { padding: 8px 4px 4px; }
.hero h2 { font-size: 26px; margin-bottom: 8px; }
.hero .lead { color: var(--text-soft); font-size: 15px; max-width: 560px; }

/* 两栏网格 */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }

/* 游戏列表 */
.games { display: flex; flex-direction: column; gap: 10px; }
.game {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  transition: border-color .15s, transform .15s;
}
.game:hover { border-color: var(--accent); transform: translateX(3px); }
.game .num {
  flex-shrink: 0;
  width: 26px; height: 26px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.game .info { flex: 1; }
.game b { font-size: 14.5px; }
.game .note { display: block; font-size: 12.5px; color: var(--text-soft); margin-top: 2px; }

/* 按钮 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 18px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  transition: transform .15s, box-shadow .15s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(161, 140, 209, .4); }
.btn-ghost {
  background: var(--bg);
  color: var(--text);
  box-shadow: none;
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }

/* 雷点 */
.warn-list li {
  padding: 8px 0 8px 26px;
  position: relative;
  font-size: 14.5px;
  border-bottom: 1px dashed var(--line);
}
.warn-list li:last-child { border-bottom: none; }
.warn-list li::before {
  content: "⚠️";
  position: absolute;
  left: 0;
  top: 8px;
  font-size: 14px;
}

/* 友链 */
.friend-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.friend-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  transition: border-color .15s, transform .15s;
}
.friend-card:hover { border-color: var(--accent); transform: translateY(-3px); }
.fc-name { font-weight: 700; font-size: 14.5px; }
.fc-url { font-size: 12px; color: var(--accent); word-break: break-all; }
.fc-desc { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

.empty { text-align: center; color: var(--text-soft); padding: 40px 20px; font-size: 14px; }

/* toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text);
  color: #fff;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 13.5px;
  font-weight: 600;
  opacity: 0;
  transition: transform .3s, opacity .3s;
  z-index: 999;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 页脚 */
.footer {
  text-align: center;
  font-size: 12.5px;
  color: var(--text-soft);
  padding: 20px 0 4px;
}
.footer .heart { color: var(--accent-2); }

/* ---------- 响应式：窄屏变顶栏 ---------- */
@media (max-width: 820px) {
  .layout { flex-direction: column; padding: 14px; gap: 14px; }
  .sidebar {
    width: 100%;
    position: static;
    flex-direction: row;
    align-items: center;
    gap: 14px;
  }
  .profile {
    display: flex;
    align-items: center;
    text-align: left;
    padding: 14px 18px;
    gap: 14px;
    flex: 1;
  }
  .avatar { width: 60px; height: 60px; margin: 0; flex-shrink: 0; }
  .avatar .paw-print { font-size: 30px; }
  .profile h1 { font-size: 19px; }
  .subtitle { margin-top: 0; }
  .tags { margin-top: 8px; justify-content: flex-start; }
  .profile .tags .tag:not(:first-child):not(:nth-child(2)) { display: none; }
  .nav { flex-direction: row; overflow-x: auto; padding: 8px; flex: 1; }
  .nav-item span:not(.nav-ic):not(.nav-count) { display: none; }
  .nav-item { flex-shrink: 0; padding: 10px 12px; }
  .sidebar-footer { display: none; }
}
@media (max-width: 480px) {
  .profile { flex-wrap: wrap; }
  .tags { width: 100%; }
}

</style>
</head>

  <script>
/* ============================================================
   应用逻辑 · app.js
   ============================================================ */

(() => {
  'use strict';

  const app = document.getElementById('app');
  const navItems = document.querySelectorAll('.nav-item');

  // ---------- 路由 ----------
  const routes = {
    '': 'home',
    '/': 'home',
    '/about': 'about',
    '/games': 'games',
    '/contact': 'contact',
    '/links': 'links',
  };

  function getPageName() {
    const hash = location.hash.replace(/^#/, '');
    return routes[hash] || 'home';
  }

  function render() {
    const name = getPageName();
    const page = PAGES[name];

    // 切换页面时更新标题
    document.title = `${SITE.name}的小站 🐾${page && page.title ? ' · ' + page.title : ''}`;

    // 渲染内容（无该页则显示空状态）
    if (page) {
      app.innerHTML = page.render();
    } else {
      app.innerHTML = `<section class="page"><div class="card empty">页面不见了 🐾<br><a class="btn" href="#/">回首页</a></div></section>`;
    }

    // 绑定复制按钮
    app.querySelectorAll('[data-copy]').forEach(btn => {
      btn.addEventListener('click', () => copyText(btn.dataset.copy));
    });

    // 导航高亮
    navItems.forEach(a => a.classList.toggle('active', a.dataset.page === name));

    // 回到顶部
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  window.addEventListener('hashchange', render);

  // ---------- 头像切换（彩蛋）----------
  const avatarEl = document.getElementById('avatar');
  let avatarIdx = 0;
  avatarEl.addEventListener('click', () => {
    avatarIdx = (avatarIdx + 1) % SITE.avatarList.length;
    // 替换内部 emoji 节点
    avatarEl.innerHTML = `<span class="paw-print">${SITE.avatarList[avatarIdx]}</span>`;
  });

  // ---------- 复制文本 + toast ----------
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => toast('已复制：' + text));
    } else {
      // 现代浏览器基本都支持 clipboard；这里做个传统 fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('已复制：' + text); }
      catch (e) { toast('复制失败，请长按手动复制'); }
      document.body.removeChild(ta);
    }
  }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- 首次加载 ----------
  if (!location.hash) location.hash = '/';
  render();

})();

</script>
